# Throwaway (ci/ipa only): the BC texture fallback test with diagnostic prints, on GitHub's
# virtual GPU, with the candidate fix, then the whole emulation suite with it.
name: Platform probe
on:
  push:
    branches: [ci/ipa]
    paths: [.github/workflows/platform-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/bc-instrument.py
            .github/bc-fix.diff
          sparse-checkout-cone-mode: false
          path: ci
      - uses: actions/checkout@v4
        with:
          ref: fix/touch-suite-reliability
          fetch-depth: 0
          path: repo
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - working-directory: repo
        run: wolkaraforever/tools/prepare.sh > /dev/null
      - name: Build with prints
        working-directory: repo/build/platform
        run: |
          patch -p1 < ../../../ci/.github/bc-fix.diff
          python3 ../../../ci/.github/bc-instrument.py
          mkdir -p build/emulation
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations -O1 -g -fsanitize=address,undefined \
            -Itranslation/AKSupport -Itranslation/Metal -Itests -framework Foundation -framework Metal \
            translation/AKSupport/AKSupport.m translation/Metal/BCTextures.m translation/Metal/BCDecode.c tests/test_bc_textures.m \
            -o build/emulation/test_bc_textures
      - name: Forced fallback, with prints
        working-directory: repo/build/platform
        run: |
          system_profiler SPDisplaysDataType | head -20 || true
          TOLKARA_BC_FALLBACK=on build/emulation/test_bc_textures > ../bc.log 2>&1 && rc=0 || rc=$?
          grep -E "PROBE|differs|Paravirtual|replaceRegion|partial|array|3D|blit|texture to|heap|read back|PASS" ../bc.log | head -80
          echo "exit $rc"
      - name: The whole emulation suite, with the fix (no prints)
        working-directory: repo
        run: |
          wolkaraforever/tools/prepare.sh > /dev/null
          (cd build/platform && patch -p1 < ../../../ci/.github/bc-fix.diff)
          (cd build/platform && bash tools/test_emulation.sh) > build/suite.log 2>&1 && rc=0 || rc=$?
          tail -12 build/suite.log
          grep -E "^(FAIL|ERROR): " build/suite.log | head || true
          grep -c PLATFORM_EMULATION_COMPLETE build/suite.log || true
          echo "suite exit $rc"
