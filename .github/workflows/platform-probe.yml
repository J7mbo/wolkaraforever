# Throwaway (ci/ipa only): the launcher UI policy check alone on the MR branch, set up exactly as
# the Validate workflow's launcher group, with its output in the log and a timestamp per line.
name: Platform probe
on:
  push:
    branches: [ci/ipa]
    paths: [.github/workflows/platform-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      UI_BASELINE_UNCOMPARED: >-
        ipad-pro-13-m5/addons-popup.png
        ipad-pro-13-m5/wow-addons-de.png
        ipad-pro-13-m5/wow-addons-recommended-wolkararoue.png
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/touch-suite-reliability
          fetch-depth: 0
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - run: brew install xcodegen luajit
      - run: wolkaraforever/tools/setup_simulators.sh --apply
      - name: Start booting both simulators in the background
        run: |
          . wolkaraforever/tools/simulators.sh
          for s in ipad iphone; do simulator_use "$s"; nohup xcrun simctl boot "$SIM_ID" > /dev/null 2>&1 & done
      - name: check_ui_policy.sh, every line timestamped
        run: |
          wolkaraforever/tools/check_ui_policy.sh 2>&1 | while IFS= read -r line; do printf '%s %s\n' "$(date +%H:%M:%S)" "$line"; done | grep -vE "\[com\.apple\.|Df WoWFixture|Default WoWFixture|^\S+ +\"<|^\S+ +\)\}" 
