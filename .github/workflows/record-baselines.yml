# Throwaway (ci/ipa only): records the launcher baselines on GitHub's matrix simulators, in UTC,
# for the branch in .github/baseline-ref, and pushes each device's images to its own branch.
name: Record launcher baselines
on:
  push:
    branches: [ci/ipa]
    paths: [.github/baseline-ref, .github/workflows/record-baselines.yml]
permissions:
  contents: write
jobs:
  record:
    name: record ${{ matrix.simulator }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { simulator: ipad, device: ipad-pro-13-m5 }
          - { simulator: iphone, device: iphone-duo }
    env:
      SIMULATOR: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/baseline-ref
          sparse-checkout-cone-mode: false
          path: ci
      - id: target
        run: echo "ref=$(tr -d '[:space:]' < ci/.github/baseline-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: repo
          fetch-depth: 0
      - run: sudo mdutil -a -i off > /dev/null || true
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - working-directory: repo
        run: wolkaraforever/tools/setup_simulators.sh --apply
      - working-directory: repo
        run: |
          . wolkaraforever/tools/simulators.sh
          simulator_use "$SIMULATOR"; xcrun simctl boot "$SIM_ID" || true
      - run: brew install xcodegen
      - name: Record
        working-directory: repo
        run: UI_BASELINE_MODE=record wolkaraforever/tools/test_wow_launcher_ui.sh
      - name: Push the images to their own branch
        working-directory: repo
        run: |
          git config user.name J7mbo
          git config user.email 2657310+J7mbo@users.noreply.github.com
          git checkout -b baselines-${{ matrix.device }}
          git add wolkaraforever/WoW/tests/ui-baselines/launcher/${{ matrix.device }}
          git status --short | head -30
          git commit -qm "ui(baselines): launcher, ${{ matrix.device }}, recorded in UTC on GitHub's iOS 27.2 simulator" || echo "nothing changed"
          git push -f origin HEAD:refs/heads/baselines-${{ matrix.device }}
