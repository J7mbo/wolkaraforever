# Throwaway (ci/ipa only): run the touch suites and the layer gate on each branch or commit
# named in .github/test-ref (one per line; add main's commit as a baseline), on both matrix
# simulators (one job per simulator, booted first), whenever this branch is pushed.
name: Branch tests
on:
  push:
    branches: [ci/ipa]
    paths: [.github/test-ref, .github/workflows/test-branch.yml]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/test-ref
          sparse-checkout-cone-mode: false
      - id: refs
        run: echo "refs=$(grep -v '^\s*$' .github/test-ref | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin]))')" >> "$GITHUB_OUTPUT"
  test:
    needs: plan
    name: ${{ matrix.ref }} on ${{ matrix.simulator }}
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.plan.outputs.refs) }}
        simulator: [ipad, iphone]
    env:
      SIMULATOR: ${{ matrix.simulator }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: repo
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/fixture-launch.py
          sparse-checkout-cone-mode: false
          path: fix
      - name: Apply the CI fixes (launch, time limits, prepare and compile reuse; candidate for its own MR)
        run: python3 -I fix/.github/fixture-launch.py repo/wolkaraforever/tools/test_touch_controls_ui.sh repo/wolkaraforever/tools/test_touch_gamepad_ui.sh repo/wolkaraforever/tools/prepare.sh
      - name: Use Xcode 27
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
          xcodebuild -version
          git -C repo log -1 --format='testing %H %s'
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i "duo\|ipad pro 13" || true
      - name: Matrix simulators
        working-directory: repo
        run: wolkaraforever/tools/setup_simulators.sh --apply
      - name: Boot the simulator now (its first-boot setup overlaps the steps below)
        working-directory: repo
        run: |
          . wolkaraforever/tools/simulators.sh
          simulator_use "$SIMULATOR"
          xcrun simctl boot "$SIM_ID" || true
          date '+booting at %H:%M:%S'
      - name: Tolkara upstream for the layer gate
        working-directory: repo
        run: git fetch --no-tags https://github.com/tolkara/tolkara.git main:refs/remotes/upstream/main
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Layer gate
        if: ${{ !cancelled() && matrix.simulator == 'ipad' }}
        working-directory: repo
        run: wolkaraforever/tools/check_layers.sh
      - name: Touch gamepad
        if: ${{ !cancelled() }}
        working-directory: repo
        run: |
          wolkaraforever/tools/test_touch_gamepad_ui.sh
          wolkaraforever/tools/test_touch_gamepad_ui.sh --self-test-input
      - name: Touch controls
        if: ${{ !cancelled() }}
        working-directory: repo
        run: wolkaraforever/tools/test_touch_controls_ui.sh
      - name: Crash reports
        if: ${{ !cancelled() }}
        run: |
          for f in $(ls -t ~/Library/Logs/DiagnosticReports/Touch*.ips 2>/dev/null | head -4); do
            echo "=== $f"; head -c 12000 "$f"; echo
          done
          ls ~/Library/Logs/DiagnosticReports/ | tail -20 || true
