# Throwaway (ci/ipa only): the full touch sequence in ONE job for the branch in .github/diag-ref
# (layer gate, then gamepad and controls on both matrix simulators), saving both simulators'
# own logs at the end so a silent kill shows who and why.
name: Gamepad diagnose
on:
  push:
    branches: [ci/ipa]
    paths: [.github/diag-ref, .github/workflows/gamepad-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    name: sequence ${{ matrix.copy }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/diag-ref
          sparse-checkout-cone-mode: false
          path: ci
      - id: target
        run: echo "ref=$(tr -d '[:space:]' < ci/.github/diag-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: repo
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/fixture-flush.py
          sparse-checkout-cone-mode: false
          path: fix
      - name: Apply the candidate fixture fix
        run: python3 fix/.github/fixture-flush.py repo/wolkaraforever/Touch/tests/test_touch_gamepad_app.m repo/wolkaraforever/Touch/tests/test_touch_controls_app.m
      - name: Use Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - name: Matrix simulators
        working-directory: repo
        run: wolkaraforever/tools/setup_simulators.sh --apply
      - name: Controls - iPad Pro 13-inch (M5)
        id: cpad
        continue-on-error: true
        working-directory: repo
        run: wolkaraforever/tools/test_touch_controls_ui.sh
      - name: Log - controls-ipad
        if: ${{ !cancelled() }}
        run: |
          mkdir -p diag
          xcrun simctl spawn "iPad Pro 13-inch (M5)" log show --last 30m --style compact --info --debug \
            --predicate 'process CONTAINS "Touch" OR eventMessage CONTAINS "touch-controls" OR eventMessage CONTAINS "TouchControls" OR (process == "runningboardd" AND (eventMessage CONTAINS "termination" OR eventMessage CONTAINS "exited")) OR (process == "SpringBoard" AND (eventMessage CONTAINS "watchdog" OR eventMessage CONTAINS "Process exited"))' \
            > "diag/controls-ipad.log" 2>&1 || true
          echo "controls-ipad: $(wc -l < diag/controls-ipad.log) lines"
          grep -E "termination reported by launchd|exited with context|Successfully spawned TouchControls" "diag/controls-ipad.log" | tail -30
      - name: Controls - iPhone Duo
        id: cphone
        continue-on-error: true
        working-directory: repo
        env:
          SIMULATOR: iphone
        run: wolkaraforever/tools/test_touch_controls_ui.sh
      - name: Log - controls-iphone
        if: ${{ !cancelled() }}
        run: |
          mkdir -p diag
          xcrun simctl spawn "iPhone Duo" log show --last 30m --style compact --info --debug \
            --predicate 'process CONTAINS "Touch" OR eventMessage CONTAINS "touch-controls" OR eventMessage CONTAINS "TouchControls" OR (process == "runningboardd" AND (eventMessage CONTAINS "termination" OR eventMessage CONTAINS "exited")) OR (process == "SpringBoard" AND (eventMessage CONTAINS "watchdog" OR eventMessage CONTAINS "Process exited"))' \
            > "diag/controls-iphone.log" 2>&1 || true
          echo "controls-iphone: $(wc -l < diag/controls-iphone.log) lines"
          grep -E "termination reported by launchd|exited with context|Successfully spawned TouchControls" "diag/controls-iphone.log" | tail -30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: touch-sequence-diagnose-${{ matrix.copy }}
          path: diag
      - name: Result
        if: ${{ !cancelled() }}
        run: |
          echo "controls iPad=${{ steps.cpad.outcome }} iPhone=${{ steps.cphone.outcome }}"
          test "${{ steps.cpad.outcome }}${{ steps.cphone.outcome }}" = successsuccess
