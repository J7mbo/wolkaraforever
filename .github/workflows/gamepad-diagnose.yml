# Throwaway (ci/ipa only): the touch suites (gamepad and controls, iPad and iPhone) for the branch
# in .github/diag-ref, with the candidate fix applied: fixtures write their output straight to
# files and their own system-log entries are added, instead of the simulator's console relay.
name: Gamepad diagnose
on:
  push:
    branches: [ci/ipa]
    paths: [.github/diag-ref, .github/workflows/gamepad-diagnose.yml, .github/fixture-launch.py]
permissions:
  contents: read
jobs:
  diagnose:
    name: sequence ${{ matrix.copy }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/diag-ref
          sparse-checkout-cone-mode: false
          path: ci
      - id: target
        run: echo "ref=$(tr -d '[:space:]' < ci/.github/diag-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: repo
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/fixture-launch.py
          sparse-checkout-cone-mode: false
          path: fix
      - name: Apply the candidate fix
        run: python3 -I fix/.github/fixture-launch.py repo/wolkaraforever/tools/test_touch_controls_ui.sh repo/wolkaraforever/tools/test_touch_gamepad_ui.sh
      - name: Use Xcode 27
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_27*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - name: Matrix simulators
        working-directory: repo
        run: wolkaraforever/tools/setup_simulators.sh --apply
      - name: Gamepad - iPad Pro 13-inch (M5)
        id: gpad
        continue-on-error: true
        working-directory: repo
        run: wolkaraforever/tools/test_touch_gamepad_ui.sh
      - name: Keep the gamepad iPad logs
        if: ${{ !cancelled() }}
        run: mkdir -p diag/gamepad-ipad && cp -R repo/build/platform/build/touch-gamepad-fixture/*.log* diag/gamepad-ipad/ 2>/dev/null || true
      - name: Gamepad - iPhone Duo
        id: gphone
        continue-on-error: true
        working-directory: repo
        env:
          SIMULATOR: iphone
        run: wolkaraforever/tools/test_touch_gamepad_ui.sh
      - name: Controls - iPad Pro 13-inch (M5)
        id: cpad
        continue-on-error: true
        working-directory: repo
        run: wolkaraforever/tools/test_touch_controls_ui.sh
      - name: Keep the iPad logs
        if: ${{ !cancelled() }}
        run: mkdir -p diag/ipad && cp -R repo/build/platform/build/touch-controls-fixture/*.log* diag/ipad/ 2>/dev/null || true
      - name: Controls - iPhone Duo
        id: cphone
        continue-on-error: true
        working-directory: repo
        env:
          SIMULATOR: iphone
        run: wolkaraforever/tools/test_touch_controls_ui.sh
      - name: Keep the iPhone logs
        if: ${{ !cancelled() }}
        run: mkdir -p diag/iphone && cp -R repo/build/platform/build/touch-gamepad-fixture/*.log* repo/build/platform/build/touch-controls-fixture/*.log* diag/iphone/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: touch-fix-${{ matrix.copy }}
          path: diag
      - name: Result
        if: ${{ !cancelled() }}
        run: |
          echo "gamepad iPad=${{ steps.gpad.outcome }} iPhone=${{ steps.gphone.outcome }}"
          echo "controls iPad=${{ steps.cpad.outcome }} iPhone=${{ steps.cphone.outcome }}"
          test "${{ steps.gpad.outcome }}${{ steps.gphone.outcome }}${{ steps.cpad.outcome }}${{ steps.cphone.outcome }}" = successsuccesssuccesssuccess
